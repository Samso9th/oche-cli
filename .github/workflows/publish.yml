# Stages oche-cli on npm when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# The tag must match "version" in package.json. Approve the staged version
# with 2FA at npmjs.com → Staged Packages (or `npm stage approve <id>`).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: oche # must match the Trusted Publisher on npmjs.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # `npm stage` needs npm 12.
      - run: npm install -g npm@12

      # Signs in over OIDC (npm Trusted Publishing); no stored token. The
      # Trusted Publisher only allows staging, so a human approves each release.
      - run: npm stage publish
