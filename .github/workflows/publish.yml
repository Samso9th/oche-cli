# Publishes oche-cli to npm when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# The tag must match "version" in package.json.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance now, Trusted Publishing later

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # NPM_TOKEN is only for the first publish. Once Trusted Publishing is set
      # up on npmjs.com, delete the secret and this env block; npm then signs in
      # over OIDC.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
